<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="skyGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#46a0e9"/>
      <stop offset="25%" stop-color="#1f71ba"/>
      <stop offset="55%" stop-color="#0b4382"/>
      <stop offset="100%" stop-color="#041f42"/>
    </radialGradient>

    <!-- Glass Ribbon 1 -->
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8ecff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#55c2ff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#0066cc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#002b66" stop-opacity="0"/>
    </linearGradient>

    <!-- Glass Ribbon 2 -->
    <linearGradient id="ribbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#7be6ff" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0088ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003388" stop-opacity="0"/>
    </linearGradient>

    <!-- Golden Accent Stream -->
    <linearGradient id="amberStream" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffdd66" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffcc33" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#ff9900" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow blur -->
    <filter id="aeroGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <!-- Deep Blue Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGlow)"/>

  <!-- Center Radiance -->
  <circle cx="960" cy="520" r="480" fill="#69c0ff" opacity="0.25" filter="url(#aeroGlow)"/>
  <circle cx="960" cy="500" r="220" fill="#ffffff" opacity="0.35" filter="url(#aeroGlow)"/>

  <!-- Aero Light Curves and Glass Waves -->
  <path d="M-100,750 C400,680 750,820 1200,600 C1550,420 1780,480 2050,380 L2050,1100 L-100,1100 Z" fill="url(#ribbon1)" opacity="0.6" filter="url(#softBlur)"/>
  
  <path d="M-100,600 C450,450 780,680 1150,490 C1520,300 1750,360 2050,220 L2050,1100 L-100,1100 Z" fill="url(#ribbon2)" opacity="0.5"/>

  <path d="M200,1080 C600,850 920,620 1350,510 C1650,430 1850,460 2050,420" fill="none" stroke="url(#amberStream)" stroke-width="45" filter="url(#aeroGlow)"/>

  <path d="M-50,680 C380,520 850,720 1280,510 C1600,350 1820,400 2050,310" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.8" filter="url(#aeroGlow)"/>

  <path d="M-50,710 C420,550 890,750 1320,540 C1640,380 1860,430 2050,340" fill="none" stroke="#7de6ff" stroke-width="3" opacity="0.6"/>

  <!-- Subtle Bokeh Light Spheres -->
  <circle cx="580" cy="580" r="140" fill="#a8e6cf" opacity="0.12" filter="url(#softBlur)"/>
  <circle cx="1320" cy="460" r="90" fill="#ffd3b6" opacity="0.15" filter="url(#softBlur)"/>
  <circle cx="820" cy="420" r="60" fill="#ffffff" opacity="0.25" filter="url(#softBlur)"/>
  <circle cx="1150" cy="620" r="110" fill="#7be6ff" opacity="0.1" filter="url(#softBlur)"/>
  <circle cx="1520" cy="540" r="75" fill="#55c2ff" opacity="0.18" filter="url(#softBlur)"/>

  <!-- Windows 7 Glass Emblem (Central Logo) -->
  <g transform="translate(960, 480) scale(1.1)" opacity="0.9" filter="url(#aeroGlow)">
    <!-- Red Pane -->
    <path d="M-36,-38 C-20,-45 -4,-45 12,-38 C10,-20 9,-2 9,14 C-7,7 -23,7 -39,14 C-39,-3 -38,-21 -36,-38 Z" fill="#eb3c27" opacity="0.9"/>
    <path d="M-36,-38 C-20,-45 -4,-45 12,-38 C10,-20 9,-2 9,14 C-7,7 -23,7 -39,14 C-39,-3 -38,-21 -36,-38 Z" fill="none" stroke="#ff8577" stroke-width="2"/>
    <!-- Green Pane -->
    <path d="M18,-36 C34,-43 50,-43 66,-36 C64,-19 63,-1 63,15 C47,8 31,8 15,15 C15,-2 16,-20 18,-36 Z" fill="#8ec641" opacity="0.9"/>
    <path d="M18,-36 C34,-43 50,-43 66,-36 C64,-19 63,-1 63,15 C47,8 31,8 15,15 C15,-2 16,-20 18,-36 Z" fill="none" stroke="#c0e888" stroke-width="2"/>
    <!-- Blue Pane -->
    <path d="M-39,20 C-23,13 -7,13 9,20 C9,36 10,54 12,72 C-4,65 -20,65 -36,72 C-38,55 -39,37 -39,20 Z" fill="#1b9dd9" opacity="0.9"/>
    <path d="M-39,20 C-23,13 -7,13 9,20 C9,36 10,54 12,72 C-4,65 -20,65 -36,72 C-38,55 -39,37 -39,20 Z" fill="none" stroke="#68cbff" stroke-width="2"/>
    <!-- Yellow Pane -->
    <path d="M15,21 C31,14 47,14 63,21 C63,37 64,55 66,72 C50,65 34,65 18,72 C16,55 15,37 15,21 Z" fill="#fbb034" opacity="0.9"/>
    <path d="M15,21 C31,14 47,14 63,21 C63,37 64,55 66,72 C50,65 34,65 18,72 C16,55 15,37 15,21 Z" fill="none" stroke="#ffe07d" stroke-width="2"/>
  </g>
</svg>
